<!-- templates/upload.html -->

<!DOCTYPE html>
<html>
<head>
    <title>File Converter - Upload</title>
</head>
<body>
    <h2>Convert Your File</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Convert</button>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
</body>
</html>
